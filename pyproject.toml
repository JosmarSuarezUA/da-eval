[project]
name = "da-eval"
version = "0.2.0"
description = "Shared domain-adaptation evaluation for object detectors (RT-DETRv4, D-FINE, Ultralytics)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# torch is intentionally not listed: the model repository's environment provides it.
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "pycocotools",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "wandb",
]

[project.scripts]
da-eval = "da_eval.cli:main"
da-train = "da_eval.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["da_eval"]
